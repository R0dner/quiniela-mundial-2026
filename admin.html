<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Quiniela Mundial 2026</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.2); border-radius: 30px; color: rgba(255,255,255,0.7); cursor: pointer; }
        .tab-btn.active { background: rgba(255,215,0,0.2); border-color: #ffd700; color: #ffd700; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grupos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .grupo-card { background: rgba(0,0,0,0.4); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,215,0,0.2); }
        .grupo-card h3 { color: #ffd700; }
        .participante-item { display: flex; justify-content: space-between; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 5px; }
        .form-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .form-input { flex: 1; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: white; }
    </style>
</head>
<body>
    <div id="admin-auth" class="admin-auth">
        <div class="auth-box">
            <h2>🔒 Área de Administración</h2>
            <input type="password" id="admin-password" placeholder="Contraseña">
            <button id="verify-admin">Ingresar</button>
            <div id="auth-error"></div>
        </div>
    </div>

    <div id="admin-content" style="display: none;">
        <div class="container">
            <header class="worldcup-header">
                <h1>👑 Panel de Administración</h1>
                <button id="logout-btn">🚪 Cerrar Sesión</button>
            </header>

            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="grupos">🏆 Grupos</button>
                <button class="tab-btn" data-tab="participantes">👥 Participantes</button>
                <button class="tab-btn" data-tab="resultados">⚽ Resultados</button>
            </div>

            <div id="tab-grupos" class="tab-content active">
                <div class="admin-section">
                    <h2>Crear Nuevo Grupo</h2>
                    <div class="form-row">
                        <input type="text" id="nuevo-grupo-id" placeholder="ID" class="form-input">
                        <input type="text" id="nuevo-grupo-nombre" placeholder="Nombre" class="form-input">
                        <input type="password" id="nuevo-grupo-contrasena" placeholder="Contraseña" class="form-input">
                        <button id="crear-grupo-btn" class="btn-primary">Crear</button>
                    </div>
                    <h2>Grupos Existentes</h2>
                    <div id="lista-grupos" class="grupos-grid"></div>
                </div>
            </div>

            <div id="tab-participantes" class="tab-content">
                <div class="admin-section">
                    <h2>Participantes por Grupo</h2>
                    <select id="grupo-participantes-select" class="form-input">
                        <option value="">Seleccionar grupo</option>
                    </select>
                    <div id="participantes-lista" style="margin-top: 20px;"></div>
                </div>
            </div>

            <div id="tab-resultados" class="tab-content">
                <div class="admin-section">
                    <h2>Cargar Resultados</h2>
                    <select id="grupo-resultados-select" class="form-input">
                        <option value="">Seleccionar grupo</option>
                    </select>
                    <div id="resultados-container"></div>
                    <button id="guardar-resultados" class="btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        
        function verificarAcceso() {
            if (document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                sessionStorage.setItem('admin_auth', 'true');
                if (typeof initAdminApp === 'function') initAdminApp();
            } else {
                document.getElementById('auth-error').textContent = 'Contraseña incorrecta';
            }
        }
        
        document.getElementById('verify-admin')?.addEventListener('click', verificarAcceso);
        if (sessionStorage.getItem('admin_auth') === 'true') {
            document.getElementById('admin-auth').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
        }
        
        window.initAdminApp = function() {
            import('./src/admin.js').then(module => {
                console.log('Admin cargado');
            });
        };
        
        document.getElementById('logout-btn')?.addEventListener('click', () => {
            sessionStorage.removeItem('admin_auth');
            location.reload();
        });
    </script>
    <script type="module" src="src/admin.js"></script>
</body>
</html>
