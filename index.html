<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundial 2026 | Apuestas</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* Estilos adicionales */
        .grupos-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .grupo-card-selector {
            background: rgba(10, 20, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
        }
        .grupo-card-selector:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(10, 20, 40, 0.9);
        }
        .grupo-card-selector.seleccionado {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .grupo-nombre {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        .grupo-descripcion {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .registro-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .form-registro {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
            font-size: 0.8rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: white;
        }
        .btn-registrar {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #0a1e3c;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            height: 42px;
        }
        .mensaje-exito {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .mensaje-error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .participante-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .cambiar-grupo-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }
        .contrasena-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
        }
        .contrasena-input-group {
            display: flex;
            gap: 10px;
        }
        .contrasena-input-group input {
            flex: 1;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="worldcup-header">
            <div class="logo">
                <img src="/assets/trophy.png" alt="Copa Mundial FIFA" class="copa-oficial" onerror="this.outerHTML='<span style=\'font-size:32px;\'>🏆</span>'">
            </div>
            <h1>🇲🇽🇺🇸🇨🇦 Quiniela Mundial 2026</h1>
            <p class="subtitle">Seleccioná un grupo, registrate y comenzá a apostar</p>
        </header>

        <!-- Lista de grupos -->
        <div class="grupos-lista" id="grupos-lista">
            <div class="loading">Cargando grupos...</div>
        </div>

        <!-- Panel de contraseña (se muestra al seleccionar grupo) -->
        <div id="contrasena-panel" class="contrasena-panel" style="display: none;">
            <label>🔐 Contraseña del grupo:</label>
            <div class="contrasena-input-group">
                <input type="password" id="grupo-contrasena" placeholder="Ingresá la contraseña del grupo" autocomplete="off">
                <button id="validar-contrasena-btn" class="btn-secondary">🔓 Validar</button>
            </div>
            <div id="contrasena-error" class="error-msg"></div>
        </div>

        <!-- Panel de registro (se muestra después de validar contraseña) -->
        <div id="registro-panel" class="registro-panel" style="display: none;">
            <h3 id="grupo-seleccionado-nombre"></h3>
            <div class="form-registro">
                <div class="form-group">
                    <label>👤 Tu nombre</label>
                    <input type="text" id="registro-nombre" placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label>📞 Teléfono (opcional)</label>
                    <input type="tel" id="registro-telefono" placeholder="Número de contacto">
                </div>
                <button id="registrar-btn" class="btn-registrar">📝 Registrarse y Apostar</button>
            </div>
            <div id="registro-mensaje"></div>
        </div>

        <!-- Panel de apuestas (se muestra después de registrarse) -->
        <div id="apuestas-panel" style="display: none;">
            <div class="participante-info">
                <div>
                    <strong>👤 Participante:</strong> <span id="participante-nombre-display"></span>
                    <span id="participante-grupo-display" style="margin-left: 15px;"></span>
                </div>
                <button id="cambiar-grupo-btn" class="cambiar-grupo-btn">🔄 Cambiar de Grupo</button>
            </div>
            
            <div class="calendario-container">
                <label>📅 Seleccioná el día:</label>
                <select id="dia-select" class="dia-select">
                    <option value="">Cargando calendario...</option>
                </select>
                <div id="estado-dia" class="estado-dia"></div>
            </div>

            <div id="apuestas-container" class="apuestas-grid"></div>
            
            <div class="actions">
                <button id="ver-mis-apuestas" class="btn-secondary">📋 Ver Mis Pronósticos</button>
            </div>
        </div>

        <div id="mensaje" class="mensaje"></div>

        <div class="admin-links">
            <a href="home.html">🏠 Inicio</a>
            <a href="admin.html">👑 Panel Admin</a>
            <a href="ranking.html">🏆 Ranking</a>
        </div>
    </div>

    <!-- Modal para ver apuestas -->
    <div id="modal-apuestas" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>📋 Mis Pronósticos</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
