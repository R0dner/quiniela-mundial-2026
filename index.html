<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiniela Mundial 2026 | Apuestas</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* Estilos para la lista de grupos */
        .grupos-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .grupo-card-selector {
            background: rgba(10, 20, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
        }
        .grupo-card-selector:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(10, 20, 40, 0.9);
        }
        .grupo-card-selector.seleccionado {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .grupo-nombre {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        .grupo-descripcion {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .registro-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .form-registro {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
            font-size: 0.8rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: white;
        }
        .btn-registrar {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #0a1e3c;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            height: 42px;
        }
        .btn-registrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        .mensaje-exito {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .mensaje-error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .participante-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .cambiar-grupo-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .cambiar-grupo-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }
        .apuestas-lista {
            margin: 10px 0;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .apuestas-multiples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .apuesta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.1);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .apuesta-item.acierto-exacto {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4caf50;
        }
        .apuesta-item.acierto-ganador {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
        }
        .apuesta-item.acierto-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            opacity: 0.7;
        }
        .btn-eliminar-apuesta {
            background: rgba(255, 80, 80, 0.2);
            border: none;
            color: #ff6666;
            cursor: pointer;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.8rem;
        }
        .no-apuestas {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            text-align: center;
            padding: 5px;
        }
        .nueva-apuesta-form {
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }
        .score-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .score-local, .score-visitante {
            width: 70px;
            padding: 8px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            color: white;
        }
        .btn-agregar-apuesta {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .limite-apuestas {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
            text-align: right;
        }
        .resultado-oficial {
            margin-top: 8px;
            padding: 5px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #ffd700;
            text-align: center;
        }
        .total-puntos {
            background: rgba(255, 215, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
        }
        .apuesta-resumen {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .badge-activo { background: rgba(76, 175, 80, 0.2); color: #4caf50; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
        .badge-pasado { background: rgba(244, 67, 54, 0.2); color: #f44336; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
        .badge-futuro { background: rgba(255, 193, 7, 0.2); color: #ffc107; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
        .admin-links {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .admin-links a {
            color: #ffd700;
            text-decoration: none;
            margin: 0 15px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
        }
        .modal-content {
            background: #1a1a2e;
            margin: 10% auto;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            border: 1px solid rgba(255,215,0,0.3);
            max-height: 80%;
            overflow-y: auto;
        }
        .modal-close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #ffd700;
        }

        /* Modal de verificación profesional */
        .modal-verificacion {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal-verificacion-content {
            background: linear-gradient(135deg, #0f1a2e, #0a0f1f);
            border-radius: 24px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-verificacion-header {
            margin-bottom: 20px;
        }
        .modal-verificacion-header .modal-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        .modal-verificacion-header h3 {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .modal-verificacion-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        .modal-verificacion-body {
            margin-bottom: 25px;
        }
        .modal-verificacion-body input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s;
        }
        .modal-verificacion-body input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        .modal-verificacion-body input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-verificar {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #0a1e3c;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .btn-verificar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }
        .btn-registrar-nuevo {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .btn-registrar-nuevo:hover {
            background: rgba(255, 215, 0, 0.15);
            transform: translateY(-2px);
        }
        .btn-cancelar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .btn-cancelar:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .mensaje-error-modal {
            background: rgba(244, 67, 54, 0.2);
            color: #ff8888;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.85rem;
            display: none;
        }
        .mensaje-error-modal.visible {
            display: block;
        }
        .grupo-info-modal {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #ffd700;
        }

        /* ============ ESTILOS MEJORADOS PARA APUESTAS ============ */

        /* Contenedor de cada partido */
        .apuesta-card {
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            transition: all 0.3s ease;
        }

        .apuesta-card:hover {
            border-color: rgba(255, 215, 0, 0.4);
            transform: translateY(-2px);
        }

        .apuesta-card.bloqueado {
            opacity: 0.7;
            background: rgba(10, 20, 40, 0.3);
        }

        /* Información del partido */
        .match-info {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        .match-teams {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .match-date {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }

        /* Lista de pronósticos existentes */
        .apuestas-lista {
            margin: 15px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            min-height: 60px;
        }

        .apuestas-multiples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .apuesta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 215, 0, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .apuesta-item.acierto-exacto {
            background: rgba(76, 175, 80, 0.25);
            border-color: #4caf50;
        }

        .apuesta-item.acierto-ganador {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
        }

        .apuesta-item.acierto-error {
            background: rgba(244, 67, 54, 0.15);
            border-color: #f44336;
        }

        .btn-eliminar-apuesta {
            background: rgba(255, 80, 80, 0.2);
            border: none;
            color: #ff8888;
            cursor: pointer;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-eliminar-apuesta:hover {
            background: rgba(255, 80, 80, 0.5);
            transform: scale(1.1);
        }

        .no-apuestas {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            padding: 8px;
        }

        /* Formulario de nueva apuesta */
        .nueva-apuesta-form {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 215, 0, 0.15);
        }

        .score-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Inputs mejorados */
        .score-local, .score-visitante {
            width: 85px;
            padding: 12px 8px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .score-local:focus, .score-visitante:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.8);
        }

        .score-local::placeholder, .score-visitante::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            font-weight: normal;
        }

        .vs {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-agregar-apuesta {
            background: linear-gradient(135deg, #4caf50, #45a049);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-agregar-apuesta:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-agregar-apuesta:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .limite-apuestas {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 10px;
            text-align: center;
        }

        /* Resultado oficial */
        .resultado-oficial {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: #ffd700;
            margin-top: 10px;
        }

        /* ============ RESPONSIVE PARA MÓVILES ============ */
        @media (max-width: 768px) {
            .apuesta-card {
                padding: 15px;
            }
            
            .match-teams {
                font-size: 0.95rem;
                gap: 8px;
                flex-direction: column;
            }
            
            .match-teams .flag-icon {
                width: 20px;
                height: auto;
            }
            
            .score-inputs {
                gap: 8px;
            }
            
            .score-local, .score-visitante {
                width: 70px;
                padding: 10px 5px;
                font-size: 1rem;
            }
            
            .vs {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
            
            .btn-agregar-apuesta {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
            
            .apuesta-item {
                font-size: 0.75rem;
                padding: 5px 12px;
            }
            
            .btn-eliminar-apuesta {
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 550px) {
            .apuesta-card {
                padding: 12px;
            }
            
            .score-inputs {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .score-local, .score-visitante {
                width: 65px;
                padding: 8px 4px;
                font-size: 0.9rem;
            }
            
            .vs {
                order: 1;
            }
            
            .score-local {
                order: 0;
            }
            
            .score-visitante {
                order: 2;
            }
            
            .btn-agregar-apuesta {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 8px;
            }
            
            .limite-apuestas {
                order: 4;
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            .score-local, .score-visitante {
                width: 55px;
                padding: 8px 3px;
                font-size: 0.85rem;
            }
            
            .vs {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
            
            .btn-agregar-apuesta {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
            
            .match-teams {
                font-size: 0.85rem;
            }
        }

        /* Animación para nuevos pronósticos */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .apuesta-item {
            animation: fadeInUp 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="worldcup-header">
            <div class="logo">
                <img src="/assets/trophy.png" 
                     alt="Copa Mundial FIFA"
                     class="copa-oficial"
                     onerror="this.outerHTML='<span style=\'font-size:32px;\'>🏆</span>'">
            </div>
            <h1>🇲🇽🇺🇸🇨🇦 Quiniela Mundial 2026</h1>
            <p class="subtitle">Seleccioná un grupo, registrate y comenzá a apostar</p>
        </header>

        <!-- Lista de grupos -->
        <div id="seleccion-grupos">
            <h2>🏆 Grupos Disponibles</h2>
            <div id="grupos-lista" class="grupos-lista">
                <div class="loading">Cargando grupos...</div>
            </div>
        </div>

        <!-- Panel de registro -->
        <div id="registro-panel" class="registro-panel" style="display: none;">
            <h3 id="grupo-seleccionado-nombre"></h3>
            <div class="form-registro">
                <div class="form-group">
                    <label>👤 Tu nombre</label>
                    <input type="text" id="registro-nombre" placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label>📞 Teléfono (opcional)</label>
                    <input type="tel" id="registro-telefono" placeholder="Número de contacto">
                </div>
                <button id="registrar-btn" class="btn-registrar">📝 Registrarse y Apostar</button>
            </div>
            <div id="registro-mensaje"></div>
        </div>

        <!-- Panel de apuestas -->
        <div id="apuestas-panel" style="display: none;">
            <div class="participante-info">
                <div>
                    <strong>👤 Participante:</strong> <span id="participante-nombre-display"></span>
                    <span id="participante-grupo-display" style="margin-left: 15px;"></span>
                </div>
                <button id="cambiar-grupo-btn" class="cambiar-grupo-btn">🔄 Cambiar de Grupo</button>
            </div>
            
            <div class="calendario-container">
                <label>📅 Seleccioná el día:</label>
                <select id="dia-select" class="dia-select">
                    <option value="">Cargando calendario...</option>
                </select>
                <div id="estado-dia" class="estado-dia"></div>
            </div>
