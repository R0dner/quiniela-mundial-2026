<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundial 2026 | Apuesta por Día</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header class="worldcup-header">
            <div class="logo">
                <img src="/assets/trophy.png" 
                     alt="Copa Mundial FIFA"
                     class="copa-oficial"
                     onerror="this.outerHTML='<span style=\'font-size:32px;\'>🏆</span>'">
            </div>
            <h1>🇲🇽🇺🇸🇨🇦 Quiniela Mundial 2026</h1>
            <p class="subtitle">Agregá tus pronósticos - Múltiples apuestas por partido</p>
        </header>

        <!-- SELECTOR DE GRUPO -->
        <div class="grupo-selector-container">
            <label>🏆 Seleccioná tu grupo:</label>
            <select id="grupo-select" class="grupo-select">
                <option value="">Cargando grupos...</option>
            </select>
        </div>

        <!-- Panel de contraseña (se muestra al seleccionar grupo) -->
        <div id="contrasena-panel" class="contrasena-panel" style="display: none;">
            <label>🔐 Contraseña del grupo:</label>
            <div class="contrasena-input-group">
                <input type="password" id="grupo-contrasena" placeholder="Ingresá la contraseña del grupo" autocomplete="off">
                <button id="validar-contrasena-btn" class="btn-secondary">🔓 Validar</button>
            </div>
            <div id="contrasena-error" class="error-msg"></div>
        </div>

        <div class="calendario-container">
            <label>📅 Seleccioná el día:</label>
            <select id="dia-select" class="dia-select" disabled>
                <option value="">Cargando calendario...</option>
            </select>
            <div id="estado-dia" class="estado-dia"></div>
        </div>

        <div class="participant-panel">
            <input type="text" id="participante-nombre" placeholder="Tu nombre" autocomplete="off" list="participantes-list" disabled>
            <datalist id="participantes-list"></datalist>
            <div id="error-nombre" class="error-msg"></div>
        </div>

        <div id="apuestas-container" class="apuestas-grid"></div>

        <div class="actions">
            <button id="ver-mis-apuestas" class="btn-secondary" disabled>📋 Ver Mis Pronósticos</button>
        </div>

        <div id="mensaje" class="mensaje"></div>

        <div class="admin-links">
            <a href="home.html">🏠 Inicio</a>
            <a href="admin.html">👑 Panel Admin</a>
            <a href="ranking.html">🏆 Ranking</a>
        </div>
    </div>

    <!-- Modal para ver apuestas -->
    <div id="modal-apuestas" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>📋 Mis Pronósticos</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Modal de REGLAS -->
    <div id="modal-reglas" class="modal-reglas">
        <div class="modal-reglas-content">
            <div class="modal-reglas-header">
                <img src="/assets/trophy.png" alt="Copa" class="copa-modal" style="height:40px;" onerror="this.outerHTML='<span style=\'font-size:28px;\'>🏆</span>'">
                <h2>📜 REGLAS DE LA QUINIELA</h2>
                <button id="cerrar-reglas" class="close-reglas">&times;</button>
            </div>
            <div class="modal-reglas-body">
                <div id="reglas-display" class="reglas-display"></div>
                <div class="reglas-footer">
                    <small>📌 Reglas establecidas por la organización</small>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
